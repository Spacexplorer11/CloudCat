name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write  # Needed to post the preview URL as a PR comment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --locked

      - name: Minify JS
        run: |
          npx terser gl.js -o gl.min.js
          npx terser quad-storage.js -o quad-storage.min.js
          npx terser sapp_jsutils.js -o sapp_jsutils.min.js

      - name: Setup web directory
        run: |
          mkdir -p web
          cp target/wasm32-unknown-unknown/release/cloudcat.wasm web/
          cp index.html web/
          cp gl.min.js web/gl.js
          cp quad-storage.min.js web/quad-storage.js
          cp sapp_jsutils.min.js web/sapp_jsutils.js
          cp -r assets web/
          cp -r favicons web/

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: cloudcat
          directory: web
          # On PRs this creates a preview deployment; on main it deploys to production
          branch: ${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐱☂️ Preview deployed!\n**URL:** ${{ steps.deploy.outputs.url }}`
            })