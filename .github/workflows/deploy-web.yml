name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.85.0
        target: wasm32-unknown-unknown
        override: true

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        cache-targets: true

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Build WASM
      run: cargo build --target wasm32-unknown-unknown --release
      
    - name: Minify JS
      run: |
        npx terser gl.js -o gl.min.js
        npx terser quad-storage.js -o quad-storage.min.js
        npx terser sapp_jsutils.js -o sapp_jsutils.min.js

    - name: Setup web directory
      run: |
        mkdir -p web
        cp target/wasm32-unknown-unknown/release/cloudcat.wasm web/
        cp index.html web/
        cp gl.min.js web/gl.js
        cp quad-storage.min.js web/quad-storage.js
        cp sapp_jsutils.min.js web/sapp_jsutils.js
        cp -r assets web/
        cp -r favicons web/
        
        # Cache busting: append commit hash as version query parameter to assets in index.html
        VERSION=${{ github.sha }}
        sed -i "s/gl.js/gl.js?v=$VERSION/g" web/index.html
        sed -i "s/sapp_jsutils.js/sapp_jsutils.js?v=$VERSION/g" web/index.html
        sed -i "s/quad-storage.js/quad-storage.js?v=$VERSION/g" web/index.html
        sed -i "s/cloudcat.wasm/cloudcat.wasm?v=$VERSION/g" web/index.html
        
    - name: Setup Pages
      uses: actions/configure-pages@v5
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: web
        
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          custom-domain: cloudcat.akaalroop.com
